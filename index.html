<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Smart - Sistem Ujian Online Anti-Curang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS (xlsx) for Excel Parse & Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Mammoth.js for Word (docx) Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#172554',
                        },
                        danger: {
                            500: '#ef4444',
                            600: '#dc2626',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .no-select { user-select: none; -webkit-user-select: none; -moz-user-select: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Printable Styles for Exam Cards & Reports */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // INITIAL DATA & STORAGE MANAGEMENT
        // ==========================================
        const DEFAULT_SETTINGS = {
            schoolName: "SMA NEGERI 1 INDONESIA",
            schoolLogo: "https://via.placeholder.com/80/2563eb/ffffff?text=CBT",
            maxViolationCount: 3,
            autoSubmitOnViolate: true
        };

        const DEFAULT_USERS = [
            { id: "u_admin", username: "admin", password: "123", role: "admin", name: "Administrator Utama", nis_nip: "198001012005011001" },
            { id: "u_waka", username: "waka", password: "123", role: "admin_waka", name: "Dra. Hj. Siti Rahma (Waka)", nis_nip: "197503121998022001" },
            { id: "u_pengawas", username: "pengawas", password: "123", role: "admin_pengawas", name: "Budi Santoso, M.Pd (Pengawas)", nis_nip: "198204152009031002" },
            { id: "u_guru1", username: "guru", password: "123", role: "guru", name: "Ahmad Fauzi, S.Pd", subject: "Matematika", nis_nip: "198805202012011003" },
            { id: "u_siswa1", username: "siswa", password: "123", role: "siswa", name: "Andi Pratama", class: "XII MIPA 1", nis_nip: "20241001", examTaken: {} },
            { id: "u_siswa2", username: "siswa2", password: "123", role: "siswa", name: "Bina Lestari", class: "XII MIPA 1", nis_nip: "20241002", examTaken: {} },
            { id: "u_siswa3", username: "siswa3", password: "123", role: "siswa", name: "Citra Dewi", class: "XII MIPA 2", nis_nip: "20241003", examTaken: {} }
        ];

        const DEFAULT_EXAMS = [
            {
                id: "ex_101",
                title: "Ujian Akhir Semester - Matematika XII",
                subject: "Matematika",
                teacherId: "u_guru1",
                token: "MTK123",
                useToken: true,
                duration: 60, // in minutes
                isActive: true,
                startTime: "2026-10-15T08:00",
                endTime: "2026-10-20T23:59",
                questions: [
                    {
                        id: "q1",
                        type: "pg",
                        question: "Berapakah hasil dari derivatif fungsi $f(x) = 3x^2 + 5x - 4$?",
                        image: "",
                        options: { A: "6x + 5", B: "3x + 5", C: "6x - 4", D: "5x + 3", E: "6x^2 + 5" },
                        answer: "A"
                    },
                    {
                        id: "q2",
                        type: "pg",
                        question: "Jika $f(x) = 2x + 3$ dan $g(x) = x^2$, tentukan $(f \\circ g)(2)$!",
                        image: "",
                        options: { A: "7", B: "11", C: "14", D: "16", E: "19" },
                        answer: "B"
                    },
                    {
                        id: "q3",
                        type: "essay",
                        question: "Jelaskan langkah-langkah menentukan nilai maksimum suatu fungsi kuadrat pada interval tertutup!",
                        image: "",
                        answer: "Uraian penjelasan rumus dan titik stasioner."
                    }
                ]
            }
        ];

        // Storage Handlers
        function getStoredData(key, defaultVal) {
            try {
                const data = localStorage.getItem('cbt_' + key);
                return data ? JSON.parse(data) : defaultVal;
            } catch (e) {
                console.error("Storage Read Error", e);
                return defaultVal;
            }
        }

        function setStoredData(key, val) {
            try {
                localStorage.setItem('cbt_' + key, JSON.stringify(val));
            } catch (e) {
                console.error("Storage Write Error", e);
            }
        }

        // Global Application State
        let AppState = {
            currentUser: getStoredData('currentUser', null),
            settings: getStoredData('settings', DEFAULT_SETTINGS),
            users: getStoredData('users', DEFAULT_USERS),
            exams: getStoredData('exams', DEFAULT_EXAMS),
            examResults: getStoredData('examResults', []), // [{examId, studentId, score, answers, violations:[], submittedAt}]
            liveViolations: getStoredData('liveViolations', []), // [{studentId, studentName, examId, type, time}]
            activeExamSession: null // For student exam mode
        };

        function saveAllState() {
            setStoredData('settings', AppState.settings);
            setStoredData('users', AppState.users);
            setStoredData('exams', AppState.exams);
            setStoredData('examResults', AppState.examResults);
            setStoredData('liveViolations', AppState.liveViolations);
            setStoredData('currentUser', AppState.currentUser);
        }

        // ==========================================
        // UI UTILITIES & TOASTS
        // ==========================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                danger: 'bg-rose-600 text-white',
                warning: 'bg-amber-500 text-white',
                info: 'bg-slate-800 text-white'
            };

            const icons = {
                success: 'fa-circle-check',
                danger: 'fa-triangle-exclamation',
                warning: 'fa-circle-exclamation',
                info: 'fa-circle-info'
            };

            toast.className = `p-4 rounded-xl shadow-xl flex items-center gap-3 transition-all transform translate-y-4 opacity-0 pointer-events-auto ${bgColors[type] || bgColors.info}`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info} text-lg"></i>
                <div class="flex-1 text-sm font-medium">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ==========================================
        // NAVIGATION & ROUTING
        // ==========================================
        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!AppState.currentUser) {
                app.appendChild(renderLoginPage());
                return;
            }

            // Student active exam takes priority full screen UI
            if (AppState.activeExamSession && AppState.currentUser.role === 'siswa') {
                app.appendChild(renderStudentExamInterface());
                return;
            }

            // Standard Dashboard layout
            const layout = document.createElement('div');
            layout.className = "flex h-screen bg-slate-100 overflow-hidden";

            layout.appendChild(renderSidebar());

            const mainContent = document.createElement('div');
            mainContent.className = "flex-1 flex flex-col overflow-y-auto custom-scrollbar";
            
            mainContent.appendChild(renderTopNav());
            
            const bodyView = document.createElement('main');
            bodyView.className = "p-4 md:p-6 flex-1";

            const role = AppState.currentUser.role;
            if (role === 'admin' || role === 'admin_waka' || role === 'admin_pengawas') {
                bodyView.appendChild(renderAdminDashboard());
            } else if (role === 'guru') {
                bodyView.appendChild(renderGuruDashboard());
            } else if (role === 'siswa') {
                bodyView.appendChild(renderSiswaDashboard());
            }

            mainContent.appendChild(bodyView);
            layout.appendChild(mainContent);
            app.appendChild(layout);
        }

        // ==========================================
        // LOGIN PAGE
        // ==========================================
        function renderLoginPage() {
            const container = document.createElement('div');
            container.className = "min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-brand-900 to-slate-900 relative overflow-hidden";

            container.innerHTML = `
                <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f293712_1px,transparent_1px),linear-gradient(to_bottom,#1f293712_1px,transparent_1px)] bg-[size:24px_24px]"></div>
                
                <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 relative z-10 border border-white/20">
                    <div class="text-center mb-8">
                        <img src="${AppState.settings.schoolLogo}" alt="Logo Sekolah" class="w-20 h-20 mx-auto mb-3 object-contain rounded-full shadow-md bg-white p-1" onerror="this.src='https://via.placeholder.com/80?text=CBT'">
                        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">${AppState.settings.schoolName}</h1>
                        <p class="text-slate-500 text-sm font-medium mt-1">CBT System & Monitoring Anti-Curang</p>
                    </div>

                    <form id="login-form" class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Username / NISN / NIP</label>
                            <div class="relative">
                                <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400"></i>
                                <input type="text" id="login-username" required placeholder="Masukkan username" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 text-sm font-medium">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Password</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
                                <input type="password" id="login-password" required placeholder="Masukkan password" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 text-sm font-medium">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Deteksi Role Otomatis / Manual</label>
                            <select id="login-role" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500/50 text-sm font-medium bg-white">
                                <option value="auto">Otomatis dari Akun</option>
                                <option value="siswa">Siswa</option>
                                <option value="guru">Guru</option>
                                <option value="admin">Admin / Pengawas</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/30 transition-all flex items-center justify-center gap-2 text-sm">
                            <i class="fa-solid fa-right-to-bracket"></i> Masuk Ujian
                        </button>
                    </form>

                    <div class="mt-6 pt-4 border-t border-slate-200 text-center text-xs text-slate-500 flex justify-between items-center">
                        <span class="inline-flex items-center gap-1"><i class="fa-solid fa-shield-halved text-emerald-500"></i> Anti-Cheat Active</span>
                        <span>v3.5 Professional</span>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const form = container.querySelector('#login-form');
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const uVal = container.querySelector('#login-username').value.trim();
                    const pVal = container.querySelector('#login-password').value.trim();
                    const rVal = container.querySelector('#login-role').value;

                    const user = AppState.users.find(u => u.username.toLowerCase() === uVal.toLowerCase() && u.password === pVal);

                    if (user) {
                        if (rVal !== 'auto' && !user.role.includes(rVal)) {
                            showToast(`Akun ditemukan tetapi bukan bertipe ${rVal.toUpperCase()}`, 'warning');
                            return;
                        }
                        AppState.currentUser = user;
                        saveAllState();
                        showToast(`Selamat datang, ${user.name}!`, 'success');
                        renderApp();
                    } else {
                        showToast('Username atau password salah!', 'danger');
                    }
                });
            }, 0);

            return container;
        }

        // ==========================================
        // SIDEBAR & TOPNAV
        // ==========================================
        let currentTab = 'dashboard';

        function renderSidebar() {
            const sidebar = document.createElement('aside');
            sidebar.className = "w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex shrink-0 border-r border-slate-800";

            const user = AppState.currentUser;
            const role = user.role;

            let menuItems = [];

            if (role.includes('admin')) {
                menuItems = [
                    { id: 'dashboard', label: 'Dashboard & Monitor', icon: 'fa-chart-pie' },
                    { id: 'users', label: 'Manajemen Akun', icon: 'fa-users-gear' },
                    { id: 'exam_schedule', label: 'Jadwal & Permisi', icon: 'fa-calendar-check' },
                    { id: 'exam_cards', label: 'Cetak Kartu Ujian', icon: 'fa-id-card' },
                    { id: 'settings', label: 'Pengaturan Sekolah', icon: 'fa-sliders' },
                    { id: 'gas_guide', label: 'Integration Cloud & GAS', icon: 'fa-cloud-arrow-up' }
                ];
            } else if (role === 'guru') {
                menuItems = [
                    { id: 'dashboard', label: 'Monitoring Ujian', icon: 'fa-desktop' },
                    { id: 'manage_exams', label: 'Bank Soal & Ujian', icon: 'fa-file-signature' },
                    { id: 'exam_reports', label: 'Rekap & Print Nilai', icon: 'fa-file-invoice' }
                ];
            } else if (role === 'siswa') {
                menuItems = [
                    { id: 'dashboard', label: 'Daftar Ujian Saya', icon: 'fa-laptop-code' },
                    { id: 'history', label: 'Riwayat Ujian', icon: 'fa-clock-rotate-left' }
                ];
            }

            sidebar.innerHTML = `
                <div class="p-5 border-b border-slate-800 flex items-center gap-3">
                    <img src="${AppState.settings.schoolLogo}" class="w-10 h-10 rounded-lg object-contain bg-white p-0.5" onerror="this.src='https://via.placeholder.com/40'">
                    <div class="overflow-hidden">
                        <h2 class="font-bold text-white text-sm truncate">${AppState.settings.schoolName}</h2>
                        <span class="text-xs text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> Anti-Cheat Active</span>
                    </div>
                </div>

                <div class="p-4 flex-1 space-y-1">
                    <div class="text-[10px] uppercase font-bold text-slate-500 px-3 mb-2">Navigasi Utama</div>
                    ${menuItems.map(item => `
                        <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab === item.id ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                            <i class="fa-solid ${item.icon} text-base w-5 text-center"></i>
                            <span>${item.label}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="p-4 border-t border-slate-800">
                    <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl text-sm font-semibold transition-all">
                        <i class="fa-solid fa-power-off"></i> Keluar
                    </button>
                </div>
            `;

            return sidebar;
        }

        function renderTopNav() {
            const nav = document.createElement('header');
            nav.className = "bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm";

            const user = AppState.currentUser;

            nav.innerHTML = `
                <div class="flex items-center gap-3">
                    <button class="md:hidden text-slate-600 p-2" onclick="showToast('Buka di layar desktop untuk pengalaman maksimal', 'info')">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="font-semibold text-slate-700 text-sm hidden sm:block">
                        Status Sistem: <span class="text-emerald-600 font-bold"><i class="fa-solid fa-shield-check"></i> Siap Melayani Ujian</span>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <div class="text-sm font-bold text-slate-800">${user.name}</div>
                        <div class="text-xs text-slate-500 uppercase font-semibold">${user.role.replace('_', ' ')} ${user.class ? `| ${user.class}` : ''}</div>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-sm shadow-inner">
                        ${user.name.charAt(0)}
                    </div>
                </div>
            `;

            return nav;
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderApp();
        }

        function logout() {
            AppState.currentUser = null;
            AppState.activeExamSession = null;
            saveAllState();
            renderApp();
            showToast('Anda telah keluar dari akun.', 'info');
        }

        // ==========================================
        // ADMIN DASHBOARD & FEATURES
        // ==========================================
        function renderAdminDashboard() {
            const wrapper = document.createElement('div');
            wrapper.className = "space-y-6";

            if (currentTab === 'dashboard') {
                const totalStudents = AppState.users.filter(u => u.role === 'siswa').length;
                const totalTeachers = AppState.users.filter(u => u.role === 'guru').length;
                const totalExams = AppState.exams.length;
                const totalViolations = AppState.liveViolations.length;

                wrapper.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="p-3 bg-blue-100 text-brand-600 rounded-xl text-xl"><i class="fa-solid fa-user-graduate"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-semibold uppercase">Total Siswa</div>
                                <div class="text-2xl font-bold text-slate-800">${totalStudents}</div>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="p-3 bg-purple-100 text-purple-600 rounded-xl text-xl"><i class="fa-solid fa-chalkboard-user"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-semibold uppercase">Total Guru</div>
                                <div class="text-2xl font-bold text-slate-800">${totalTeachers}</div>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl text-xl"><i class="fa-solid fa-file-pen"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-semibold uppercase">Ujian Dibuat</div>
                                <div class="text-2xl font-bold text-slate-800">${totalExams}</div>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="p-3 bg-rose-100 text-rose-600 rounded-xl text-xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-semibold uppercase">Total Kecurangan</div>
                                <div class="text-2xl font-bold text-slate-800">${totalViolations}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Live Anti-Cheat Monitoring Panel -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                    <i class="fa-solid fa-shield-virus text-rose-500"></i> Monitoring Kecurangan Global Realtime
                                </h3>
                                <p class="text-xs text-slate-500">Log aktivitas berpindah tab, membuka extension, shortcut, dan keluar full screen</p>
                            </div>
                            <button onclick="AppState.liveViolations = []; saveAllState(); renderApp();" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-semibold">
                                <i class="fa-solid fa-trash"></i> Bersihkan Log
                            </button>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
                                    <tr>
                                        <th class="p-3">Waktu</th>
                                        <th class="p-3">Siswa</th>
                                        <th class="p-3">Mata Pelajaran / Ujian</th>
                                        <th class="p-3">Jenis Pelanggaran</th>
                                        <th class="p-3">Status Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${AppState.liveViolations.length === 0 ? `
                                        <tr>
                                            <td colspan="5" class="p-8 text-center text-slate-400">Belum ada kecurangan terdeteksi. Sistem berjalan aman!</td>
                                        </tr>
                                    ` : AppState.liveViolations.slice().reverse().map(v => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3 text-xs text-slate-500 font-mono">${v.time}</td>
                                            <td class="p-3 font-semibold text-slate-800">${v.studentName}</td>

        function downloadExcelTemplate() {
            const data = [
                ["Nama", "Username", "Password", "Role", "NIS_NIP", "Kelas"],
                ["Ahmad Siswa", "siswa101", "pass123", "siswa", "2024001", "XII MIPA 1"],
                ["Budi Guru", "guru101", "pass123", "guru", "19800101", "Matematika"],
                ["Pengawas Ujian", "pengawas1", "pass123", "admin_pengawas", "19850202", "-"]
            ];

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template_User");
            XLSX.writeFile(wb, "Template_Import_Akun_CBT.xlsx");
            showToast("Template Excel berhasil di-download!", "success");
        }

        function handleExcelImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

                    let count = 0;
                    rows.forEach((r) => {
                        if (r.Nama && r.Username && r.Password) {
                            AppState.users.push({
                                id: 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                                name: r.Nama,
                                username: String(r.Username),
                                password: String(r.Password),
                                role: (r.Role || 'siswa').toLowerCase(),
                                nis_nip: String(r.NIS_NIP || ''),
                                class: String(r.Kelas || ''),
                                examTaken: {}
                            });
                            count++;
                        }
                    });

                    saveAllState();
                    renderApp();
                    showToast(`Berhasil mengimpor ${count} akun dari Excel!`, 'success');
                } catch (err) {
                    showToast('Gagal membaca file Excel. Pastikan format sesuai template.', 'danger');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function importWordDocx(e, examId) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                mammoth.extractRawText({ arrayBuffer: evt.target.result })
                    .then((result) => {
                        const text = result.value;
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        
                        const exam = AppState.exams.find(ex => ex.id === examId);
                        let parsedCount = 0;

                        // Basic Parser Logic for Word
                        for (let i = 0; i < lines.length; i++) {
                            if (lines[i].toLowerCase().startsWith('soal:') || lines[i].match(/^\d+\./)) {
                                const qText = lines[i].replace(/^\d+\.|soal:/i, '').trim();
                                exam.questions.push({
                                    id: 'q_' + Date.now() + '_' + i,
                                    type: 'pg',
                                    question: qText,
                                    options: {
                                        A: lines[i+1] || "Opsi A",
                                        B: lines[i+2] || "Opsi B",
                                        C: lines[i+3] || "Opsi C",
                                        D: lines[i+4] || "Opsi D",
                                        E: lines[i+5] || "Opsi E"
                                    },
                                    answer: "A"
                                });
                                parsedCount++;
                            }
                        }

                        saveAllState();
                        showToast(`Berhasil mengimpor ${parsedCount} soal dari Word!`, 'success');
                        document.querySelector('.fixed')?.remove();
                        openQuestionBuilderModal(examId);
                    })
                    .catch(() => showToast('Gagal memproses file Word.', 'danger'));
            };
            reader.readAsArrayBuffer(file);
        }

                            </div>

                            <p class="text-base font-semibold text-slate-800 leading-relaxed">${currentQ.question}</p>

                            ${currentQ.image ? `<img src="${currentQ.image}" class="max-h-64 object-contain rounded-xl my-3">` : ''}

                            <!-- Answers Options -->
                            <div class="space-y-2.5 pt-2">
                                ${currentQ.type === 'pg' ? Object.entries(currentQ.options || {}).map(([optKey, optVal]) => {
                                    const isSelected = session.answers[currentQ.id] === optKey;
                                    return `
                                        <button onclick="selectAnswer('${currentQ.id}', '${optKey}')" class="w-full text-left p-3.5 rounded-xl border-2 transition-all flex items-center gap-3 ${isSelected ? 'border-brand-600 bg-brand-50/50 text-brand-900 font-bold' : 'border-slate-200 hover:border-slate-300 text-slate-700'}">
                                            <span class="w-7 h-7 rounded-lg border-2 flex items-center justify-center font-bold text-xs ${isSelected ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300 bg-slate-50 text-slate-600'}">${optKey}</span>
                                            <span class="text-sm">${optVal}</span>
                                        </button>
                                    `;
                                }).join('') : `
                                    <textarea oninput="saveEssayAnswer('${currentQ.id}', this.value)" rows="5" placeholder="Tuliskan jawaban uraian Anda secara rinci..." class="w-full p-4 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">${session.answers[currentQ.id] || ''}</textarea>
                                `}
                            </div>
                        </div>

                        <!-- Exam Navigation Buttons -->
                        <div class="flex items-center justify-between pt-4">
                            <button onclick="navQuestion(-1)" ${session.currentQuestionIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 bg-slate-200 text-slate-700 disabled:opacity-50 rounded-xl font-semibold text-xs flex items-center gap-2">
                                <i class="fa-solid fa-arrow-left"></i> Soal Sebelumnya
                            </button>

                            <button onclick="submitExamPrompt()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-md shadow-emerald-600/20">
                                <i class="fa-solid fa-paper-plane"></i> Selesaikan Ujian
                            </button>

                            <button onclick="navQuestion(1)" ${session.currentQuestionIndex === questions.length - 1 ? 'disabled' : ''} class="px-5 py-2.5 bg-brand-600 text-white disabled:opacity-50 rounded-xl font-semibold text-xs flex items-center gap-2">
                                Soal Selanjutnya <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </main>

                    <!-- Question Number Grid Side Panel -->
                    <aside class="w-72 bg-white border-l border-slate-200 p-5 hidden lg:flex flex-col justify-between">
                        <div>
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-4">Navigasi Nomor Soal</h4>
                            <div class="grid grid-cols-5 gap-2">
                                ${questions.map((q, idx) => {
                                    const isAnswered = session.answers[q.id] !== undefined;
                                    const isCurrent = idx === session.currentQuestionIndex;
                                    return `
                                        <button onclick="jumpQuestion(${idx})" class="h-10 rounded-xl font-bold text-xs flex items-center justify-center transition-all ${isCurrent ? 'ring-2 ring-brand-600 ring-offset-2' : ''} ${isAnswered ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                            ${idx + 1}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-500 space-y-1">
                            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-brand-600 rounded"></span> Sudah Dijawab</div>
                            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-slate-200 rounded"></span> Belum Dijawab</div>
                        </div>
                    </aside>
                </div>
            `;

            // Start Timer if not running
            if (!session.timerInterval) {
                session.timerInterval = setInterval(() => {
                    session.timeLeft--;
                    const timerEl = document.getElementById('exam-timer-display');
                    if (timerEl) {
                        const min = Math.floor(session.timeLeft / 60);
                        const sec = session.timeLeft % 60;
                        timerEl.innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                    }

                    if (session.timeLeft <= 0) {
                        clearInterval(session.timerInterval);
                        autoSubmitExam("Waktu ujian telah habis!");
                    }
                }, 1000);
            }

            // Register Real-time Anti-Cheat Protection Event Handlers
            setupAntiCheatEvents();

            return container;
        }

        // --- ANTI-CHEAT ENGINE DETECTORS ---
        let antiCheatSetupDone = false;
        function setupAntiCheatEvents() {
            if (antiCheatSetupDone) return;
            antiCheatSetupDone = true;

            const triggerCheatLog = (reason) => {
                const session = AppState.activeExamSession;
                if (!session) return;

                session.violationCount++;
                const badge = document.getElementById('violation-badge');
                if (badge) badge.innerText = session.violationCount;

                const user = AppState.currentUser;
                const violationRecord = {
                    studentId: user.id,
                    studentName: user.name,
                    examTitle: session.exam.title,
                    type: reason,
                    time: new Date().toLocaleTimeString('id-ID')
                };

                AppState.liveViolations.push(violationRecord);
                saveAllState();

                showToast(`Peringatan Kecurangan Terdeteksi: ${reason}! (${session.violationCount}/${AppState.settings.maxViolationCount})`, 'danger');

                if (session.violationCount >= AppState.settings.maxViolationCount) {
                    autoSubmitExam(`Ujian Dihentikan! Terdeteksi ${session.violationCount}x Pelanggaran (${reason}).`);
                }
            };

            // 1. Detect Tab Switch / Minimize
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && AppState.activeExamSession) {
                    triggerCheatLog('Pindah Tab / Minimasi Browser');
                }
            });

            // 2. Detect Blur Window
            window.addEventListener('blur', () => {
                if (AppState.activeExamSession) {
                    triggerCheatLog('Fokus Window Hilang / Buka Chatbot AI');
                }
            });

            // 3. Block Copy-Paste, Shortcut, F12, Right Click
            document.addEventListener('copy', (e) => { if (AppState.activeExamSession) { e.preventDefault(); triggerCheatLog('Mencoba Copy Teks'); } });
            document.addEventListener('paste', (e) => { if (AppState.activeExamSession) { e.preventDefault(); triggerCheatLog('Mencoba Paste Teks'); } });
            document.addEventListener('contextmenu', (e) => { if (AppState.activeExamSession) { e.preventDefault(); triggerCheatLog('Klik Kanan Dilarang'); } });

            document.addEventListener('keydown', (e) => {
                if (!AppState.activeExamSession) return;
                // Block Ctrl+C, Ctrl+V, Alt+Tab, F12
                if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'a', 'x', 'p', 's', 'u'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                    triggerCheatLog(`Shortkey Dilarang (Ctrl+${e.key.toUpperCase()})`);
                }
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    e.preventDefault();
                    triggerCheatLog('Mencoba Buka Inspect Element');
                }
            });
        }

        function selectAnswer(qId, optKey) {
            AppState.activeExamSession.answers[qId] = optKey;
            renderApp();
        }

        function saveEssayAnswer(qId, val) {
            AppState.activeExamSession.answers[qId] = val;
        }

        function navQuestion(dir) {
            const s = AppState.activeExamSession;
            s.currentQuestionIndex = Math.max(0, Math.min(s.exam.questions.length - 1, s.currentQuestionIndex + dir));
            renderApp();
        }

        function jumpQuestion(idx) {
            AppState.activeExamSession.currentQuestionIndex = idx;
            renderApp();
        }

        function submitExamPrompt() {
            if (confirm("Apakah Anda yakin ingin menyelesaikan dan mengirim jawaban ujian?")) {
                autoSubmitExam("Disubmit oleh siswa.");
            }
        }

        function autoSubmitExam(reason) {
            const session = AppState.activeExamSession;
            if (!session) return;

            clearInterval(session.timerInterval);
            session.timerInterval = null;

            // Calculate Score
            const questions = session.exam.questions;
            let correctCount = 0;
            let totalPg = 0;

            questions.forEach(q => {
                if (q.type === 'pg') {
                    totalPg++;
                    if (session.answers[q.id] === q.answer) {
                        correctCount++;
                    }
                }
            });

            const finalScore = totalPg > 0 ? Math.round((correctCount / totalPg) * 100) : 100;

            const user = AppState.currentUser;
            if (!user.examTaken) user.examTaken = {};
            user.examTaken[session.exam.id] = true;

            const resultObj = {
                studentId: user.id,
                studentName: user.name,
                examId: session.exam.id,
                examTitle: session.exam.title,
                score: finalScore,
                answers: session.answers,
                violationsCount: session.violationCount,
                submittedAt: new Date().toLocaleString('id-ID')
            };

            AppState.examResults.push(resultObj);
            AppState.activeExamSession = null;
            antiCheatSetupDone = false;

            saveAllState();

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }

            renderApp();
            showToast(`Ujian Selesai! Nilai Anda: ${finalScore} (${reason})`, 'success');
        }

        // ==========================================
        // GOOGLE APPS SCRIPT (GAS) CODE & GUIDE TAB
        // ==========================================
        function renderGasGuide() {
            const container = document.createElement('div');
            container.className = "bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6";

            const gasScriptCode = `
// ===================================================
// GOOGLE APPS SCRIPT (GAS) BACKEND CBT SYSTEM
// Buka Google Sheets -> Extensions -> Apps Script
// Paste Script ini lalu Deploy as Web App (Anyone)
// ===================================================

function doGet(e) {
  var op = e.parameter.op;
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  
  if (op == "getUsers") {
    var data = sheet.getSheetByName("Users").getDataRange().getValues();
    return responseJSON(data);
  }
  
  return responseJSON({status: "CBT Server Active"});
}

function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  
  if (data.op == "saveResult") {
    var resSheet = sheet.getSheetByName("Results");
    if (!resSheet) {
      resSheet = sheet.insertSheet("Results");
      resSheet.appendRow(["Waktu", "Siswa ID", "Nama", "Exam ID", "Nilai", "Pelanggaran"]);
    }
    resSheet.appendRow([new Date(), data.studentId, data.studentName, data.examId, data.score, data.violationsCount]);
    return responseJSON({status: "success"});
  }
}

function responseJSON(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
            `.trim();

            container.innerHTML = `
                <div>
                    <h3 class="text-xl font-bold text-slate-800">Panduan Integrasi Google Apps Script (GAS) & Hosting</h3>
                    <p class="text-xs text-slate-500">Gunakan Google Sheets gratisan sebagai database Cloud & hosting gratis</p>
                </div>

                <div class="space-y-3">
                    <h4 class="text-sm font-bold text-slate-700">1. Script Apps Script Siap Pakai (backend GAS)</h4>
                    <pre class="bg-slate-900 text-emerald-400 p-4 rounded-xl text-xs font-mono overflow-x-auto">${gasScriptCode}</pre>
                </div>

                <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 space-y-2 text-xs text-blue-900">
                    <h4 class="font-bold text-sm">2. Panduan Deploy Hosting Gratis:</h4>
                    <ul class="list-disc pl-4 space-y-1">
                        <td><strong>Vercel / Netlify / GitHub Pages:</strong> Simpan file <code>index.html</code> ini dan drag-and-drop ke Vercel atau GitHub Pages. Langsung online gratis HTTPS.</td>
                        <td><strong>Google Apps Script Web App:</strong> Buka Google Sheet -> Extensions -> Apps Script -> Pasang script di atas -> Deploy -> Web App (Execute as Me, Access: Anyone).</td>
                    </ul>
                </div>
            `;

            return container;
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
